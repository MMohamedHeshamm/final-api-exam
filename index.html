<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Final API Exam — Classroom</title>
    <meta name="robots" content="noindex">
    <meta name="referrer" content="no-referrer">
    <style>
        body {
            font: 16px/1.5 system-ui, sans-serif;
            background: #101625;
            color: #e8f3ff;
            display: grid;
            place-items: center;
            min-height: 95vh;
            margin: 0
        }

        main {
            text-align: center;
            max-width: 550px;
            padding: 30px
        }

        a {
            color: #7defca
        }
    </style>
</head>

<body>
    <main>
        <h1>Final API Exam</h1>
        <p>Opening the secure classroom assessment…</p>
        <p id="fallback">If you are not redirected automatically, <a id="go" href="#">open the exam here</a>.</p>
    </main>
    <script>
        const EXAM_URL = 'https://script.google.com/macros/s/AKfycbztQsSacXTvYsJH8mSG3yDQGUnT1LctGARMAbNsKoamejkn93mBWuhcnWRyR5_rkGwN/exec';
        if (/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(EXAM_URL)) {
            document.getElementById('go').href = EXAM_URL;
            window.location.replace(EXAM_URL);
        } else {
            document.querySelector('main p').textContent = 'Teacher configuration needed. The secure exam link is not set yet.';
            document.getElementById('fallback').hidden = true;
        }
    </script>
</body>

</html>
